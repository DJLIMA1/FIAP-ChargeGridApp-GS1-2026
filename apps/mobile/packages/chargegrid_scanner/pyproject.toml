[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chargegrid-scanner"
version = "0.1.0"
description = "Local-only Android QR scanner for ChargeGrid and Flet 1.0"
requires-python = ">=3.10"
dependencies = ["flet==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flutter.chargegrid_scanner" = ["pubspec.yaml", "lib/**/*.dart"]
