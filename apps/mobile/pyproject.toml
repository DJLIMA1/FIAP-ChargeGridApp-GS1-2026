[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chargegrid-app"
version = "0.9.0"
description = "Aplicativo Flet do ChargeGrid"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.0",
    # GPS do Modo motorista (extensão oficial; a versão acompanha o flet).
    "flet-geolocator==1.0.0",
    "pillow>=11,<13",
    "httpx>=0.28,<1",
    "chargegrid-scanner==0.1.0",
    "chargegrid-map==0.1.0",
]

[project.scripts]
chargegrid-app = "chargegrid_app.main:run"

[tool.flet]
# Metadata used by `flet build` for Android and other packaged targets.
product = "ChargeGrid"
artifact = "chargegrid"
bundle_id = "br.com.ffive.chargegrid"
build_number = 48
# "location": GPS do Modo motorista, pedido só quando o motorista toca "Usar minha localização".
permissions = ["camera", "location"]

# O app só lê a posição com a tela aberta: sem localização em segundo plano (o "location" do Flet a inclui).
[tool.flet.android.permission]
"android.permission.ACCESS_BACKGROUND_LOCATION" = false

[tool.flet.ios.info]
NSLocationWhenInUseUsageDescription = "O ChargeGrid usa sua localização para achar postos e o clima perto de você no Modo motorista."

[tool.flet.dev_packages]
chargegrid-scanner = "packages/chargegrid_scanner"
chargegrid-map = "packages/chargegrid_map"

[tool.flet.app]
# The mobile build uses only assets/app_config.json, generated from the public
# API URL. Never package local environment files.
exclude = [
    ".env", ".env.*", "tests", ".pytest_cache", ".ruff_cache", ".flet", "packages",
    "__pycache__", "src/chargegrid_app/__pycache__",
    "src/chargegrid_app/screens/__pycache__", "src/chargegrid_app/services/__pycache__",
    "src/chargegrid_app/ui/__pycache__",
    # Local demo preview calls OpenRouter directly; never ship it in the APK.
    "src/chargegrid_app/services/demo_ai.py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["chargegrid_app", "chargegrid_core", "test_behavior"]

# jni_flutter 1.0.4 and shared_preferences_android 2.5.0 expect jni ^1.1.0 while the Flet plugins resolve jni 1.0.x.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.3"
shared_preferences_android = "2.4.28"
