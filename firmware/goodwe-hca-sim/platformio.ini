; Carregador GoodWe HCA G2 SIMULADO (ESP32 DevKit + módulo de relés, relé na GPIO 13).
; Guia: docs/carregador-hca-simulado.md. Testes de host: python tools/validate_firmware.py --hca-only
[platformio]
default_envs = esp32dev

[env:esp32dev]
; Mesma plataforma do env esp32dev da bancada (firmware/esp32): Arduino-ESP32 2.0.17.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Mapa do HCA G2 + Modbus TCP mínimo (FC03/FC06/FC16) compartilhados com a tela.
lib_extra_dirs = ../shared
lib_ldf_mode = deep+
build_flags =
  -D CG_HCA_SIM_VERSION=\"1.0.0\"
  -D CG_RELAY_PIN=13
  ; 1 = módulo de relé ativo em LOW (padrão); 0 = ativo em HIGH. CG_RELAY_LEVEL troca em campo (NVS).
  -D CG_RELAY_ACTIVE_LOW=1
  -D CG_LED_PIN=2

[env:esp32s3]
; Mesmo carregador num ESP32-S3 (N16R8: flash 16 MB, PSRAM 8 MB) com ponte USB-serial (CH343):
; o Serial fica na UART0 (sem USB CDC nativo). Relé continua na GPIO 13; sem LED dedicado.
extends = env:esp32dev
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -D CG_HCA_SIM_VERSION=\"1.0.0\"
  -D CG_RELAY_PIN=13
  -D CG_RELAY_ACTIVE_LOW=1
  -D CG_LED_PIN=-1
  -D ARDUINO_USB_CDC_ON_BOOT=0
