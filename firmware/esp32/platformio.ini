[platformio]
default_envs = esp32dev

[env]
; Carregador externo GoodWe HCA G2 (opcional, connector.charger_link): mapa Modbus e
; Modbus TCP mínimo compartilhados com firmware/goodwe-hca-sim.
lib_extra_dirs = ../shared

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.2.1

; Profile físico confirmado: Waveshare ESP32-S3-Touch-LCD-7 (sem B), 800x480.
[env:waveshare_panel_ui]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.psram_type = opi
board_build.arduino.memory_type = dio_opi
; DIO evita reset do ROM observado em QIO nesta revisão física da placa.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_image = 40000000L
build_flags =
  -D BOARD_HAS_PSRAM
  -D CHARGEGRID_PANEL_ENABLED
  ; Totem de autoatendimento 0.8.0 (só aparece com connector.kiosk.enabled vindo da API).
  -D CHARGEGRID_KIOSK
  -D ESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
  -D BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7
  -D LV_CONF_SKIP
  -D LV_MEM_CUSTOM=0
  ; Pool do LVGL: a UI do totem (gradientes, ilustração, QRs de vínculo e pagamento) usa ~54 KB; 64 KB dá folga.
  -D LV_MEM_SIZE=65536U
  -D LV_COLOR_DEPTH=16
  -D LV_USE_QRCODE=1
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_18=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_MONTSERRAT_24=1
  -D LV_FONT_MONTSERRAT_28=1
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  lvgl/lvgl@8.4.0
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0

; Opcional, NÃO validado em placa: pool do LVGL de 192 KB na PSRAM (heap_caps_malloc SPIRAM)
; em vez de 64 KB estáticos na SRAM. O padrão continua o pool interno de 64 KB, com as telas
; atuais liberadas enquanto uma tela do totem está aberta. Risco a medir na placa: o LCD RGB
; também lê o framebuffer da PSRAM (banda/deriva da imagem). Ver README "Firmware 0.8.0".
[env:waveshare_panel_ui_psram_pool]
extends = env:waveshare_panel_ui
build_flags =
  ${env:waveshare_panel_ui.build_flags}
  -D CHARGEGRID_LVGL_PSRAM_POOL=1
  ; A biblioteca LVGL precisa achar include/lvgl_psram_pool.h.
  -I include
  -ULV_MEM_SIZE
  -D LV_MEM_SIZE=196608U
  -D LV_MEM_POOL_INCLUDE=\"lvgl_psram_pool.h\"
  -D LV_MEM_POOL_ALLOC=chargegrid_lvgl_pool_alloc

[env:waveshare_panel_demo]
extends = env:waveshare_panel_ui
; Alias de compatibilidade para o mesmo painel operacional.
