name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chargegrid_test
          POSTGRES_USER: chargegrid
          POSTGRES_PASSWORD: chargegrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chargegrid -d chargegrid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r ../../tools/requirements.txt
      - run: ruff check app tests
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://chargegrid:chargegrid@localhost:5432/chargegrid_test
          MIGRATION_DATABASE_URL: postgresql+psycopg://chargegrid:chargegrid@localhost:5432/chargegrid_test
      - run: cd ../.. && python -m pytest tools/tests
        env:
          CHARGEGRID_IMPORT_TEST_DATABASE_URL: postgresql://chargegrid:chargegrid@localhost:5432/chargegrid_test
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://chargegrid:chargegrid@localhost:5432/chargegrid_test
          DATABASE_URL: postgresql+psycopg://chargegrid:chargegrid@localhost:5432/chargegrid_test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check src tests
      - run: PYTHONPATH=src pytest tests

  qr-scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/packages/chargegrid_scanner/src/flutter/chargegrid_scanner
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  firmware-and-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r apps/api/requirements.txt -r tools/requirements.txt
      - run: ruff check tools
      - run: python -m pytest tools/tests
      - run: pip install platformio
      - run: pio run
        working-directory: firmware/esp32
